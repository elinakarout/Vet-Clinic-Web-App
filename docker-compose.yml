services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    # Migrate before serving. Without this the stack comes up healthy and then
    # 500s every request with "no such table: users" -- see scripts/start.sh.
    command: ["sh", "scripts/start.sh"]
    volumes:
      - ./api:/app
      - api-data:/app/data
      # Nested on purpose, and it must stay below api-data: the volume above
      # masks ./api/data, which is where fetch_external.py writes the FDA pages.
      # Without this line the container's knowledge base is the 7 clinic files
      # only -- Phase 9 measured 7 documents / 54 chunks in Docker against
      # 12 / 117 on the host, with nothing reporting the difference.
      - ./api/data/knowledge:/app/data/knowledge
      - hf-cache:/root/.cache/huggingface
      # Chroma's ONNX embedder unpacks here, NOT into hf-cache. Without this
      # volume every container restart re-downloads ~80 MB (Phase 6).
      - chroma-cache:/root/.cache/chroma
    env_file:
      - ./api/.env

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      # localhost, NOT the `api` service name: these requests are made by the
      # user's browser on the host, not from inside this container.
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  api-data:
  hf-cache:
  chroma-cache:
  client-node-modules:
